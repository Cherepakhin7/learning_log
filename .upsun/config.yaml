applications:
    learning_log:
        type: 'python:3.14'
        relationships:
            database: "db:postgresql"
        web:
            upstream:
                socket_family: unix
            commands:
                start: "gunicorn -w 4 -b unix:$SOCKET learning_log.wsgi:application"
            locations:
                "/":
                    passthru: true
                "/static":
                    root: "static"
                    expires: 1h
                    allow: true
        disk: 512
        mounts:
            "logs":
                source: local
                source_path: logs
        hooks:
            build: |
                pip install --upgrade pip
                pip install -r requirements.txt
                pip install -r requirements_remote.txt
                mkdir logs
                python manage.py collectstatic
                rm -rf logs
            deploy: |
                python manage.py migrate

services:
    db:
        type: postgresql:15
        disk: 1024

routes:
    "https://{default}/":
        type: upstream
        upstream: "learning_log:http"
    "https://www.{default}/":
        type: redirect
        to: "https://{default}/"